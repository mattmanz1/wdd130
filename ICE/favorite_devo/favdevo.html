<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>My Favorite Devotionals</title>
  <link rel="stylesheet" href="styles/styles.css" />
</head>
<body>
  <div class="container">
    <header class="header">
      <div class="header-image">
        <h1>My Favorite<br>Devotionals</h1>
      </div>
    </header>
    <main>
      <div class="content-box">
        <!-- Add your devotional content here -->
         <table>
          <tr>
            <th>Speaker</th>
            <th>Title</th>
            <th>Location</th>
            <th>Year</th>
          </tr>
          <tr>
            <td>Torrey Morrill</td>
            <td>A Better Covering</td>
            <td>BYUI Center</td>
            <td>2026</td>
          </tr>
          <tr>
            <td>Dan Barnes</td>
            <td>Worth, Identity, and the Great Plan of Our Eternal Father</td>
            <td>BYUI Center</td>
            <td>2026</td>
          </tr>
          <tr>
            <td>The Bednar's</td>
            <td>BYU-Idaho 25th Anniversary Devotional</td>
            <td>BYUI Center</td>
            <td>2026</td>
          </tr>
         </table>
         <form>
          <fieldset>
            <legend>Input your favorite devotional</legend>
            <label>Speaker:<input></label>
            <label>Title:<input></label>
            <label>Location:<input></label>
            <label>Year:<input></label>
            <button>Submit</button>
          </fieldset>
         </form>
      </div>
    </main>
  </div>
</body>
</html>

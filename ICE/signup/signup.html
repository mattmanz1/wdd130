<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Daily Feed Sign Up</title>

        <style>
            * {
                margin: 0;
            }

            body {
                background: rgb(120, 96, 64);
            }

            #formContainer {
                border: 15px solid navy;
                border-radius: 50px;
                margin: 15px auto;
                width: 570px;
                background-color: white;
                height: 90vh;
                overflow: hidden;
                display: flex;
                flex-direction: column;
            }

            img {
                max-width: 100%;
            }

            #closeBtn {
                position: absolute;
                top: 50px;
                left: calc(50vw - 260px);
                width: 50px;
                font-size: 2em;
                z-index: 4;
            }

            #myForm {
                background-color: white;
                flex: 1;
                display: grid;
                grid-template-columns: 1fr 1fr;
                text-align: left;
                width: 85%;
                margin: 0 auto;
                font-size: 25px;
                grid-gap: 25px;
            }

            #jesusbox {
                overflow: hidden;
                height: 250px;
                display: grid;
                grid-template-columns: 1fr;
                grid-template-rows: 110px 70px 70px;
                text-align: center;
            }
            h3 {
                margin-top: -70;
            }

            #scripture {
                display: grid;
                grid-template-columns: 1fr 1fr 1fr 1fr 1fr;
                grid-gap: 5px;
            }
            
            #daily {
                grid-row: 2 / 3;
                z-index: 3;
                grid-column: 1 / 2;
                color: white;
                text-shadow: 2px 2px 0px #000;
                font-size: 50px;
            }

            #scriptday {
                grid-row: 3 / 4;
                z-index: 2;
                grid-column: 1 / 2;
                color: white;
                text-shadow: 2px 2px 0px #000;
                font-size: 40px;
            }

            #jesus {
                grid-row: 1 / 4;
                z-index: 1;
                grid-column: 1 / 2;
            }

            h3 {
                text-align: center;
                font-size: 30px;
                font-weight: 700;
                margin: 19px;
            }

            .ch1 {
                grid-column: 1 / 3;
                text-align: center;
            }
            #ch2 {
                grid-column: 1 / 3;
                display: flex;
                justify-content: center;
                height: 20px;
            }
        </style>




    </head>

    <body>
        <div id="formContainer">
            <div id="jesusbox">
                <img src="./images/jesus_feeds_5000.jpeg" id="jesus">
                <h1 id="daily">Daily Feed</h1>
                <h2 id="scriptday">Scripture a day</h2>
            </div>
            <h3>Sign Up for Daily Scripture Feed</h3>
            <form id="myForm">
                
                <button type="button" id="closeBtn">X</button>

                <label for="username">User Name:</label>
                <input type="text" id="username" name="username" required>

                <label for="password">Password:</label>
                <input type="password" id="password" name="password" required>

                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>

                <label>Gender:</label>
                <div>
                    <input type="radio" id="male" name="gender" value="male" required>
                    <label for="male">Male</label>
                    <input type="radio" id="female" name="gender" value="female" required>
                    <label for="female">Female</label>
                </div>

                <section class="ch1">
                    <input type="checkbox" id="newsletter" name="newsletter">
                    <label for="newsletter">Subscribe to newsletter</label>
                </section>

                <section class="ch1">
                    <input type="checkbox" id="conditions" name="conditions" required>
                    <label for="conditions">I acknowledge the terms and conditions</label>
                </section>

                <section id="ch2">
                    <button type="submit">Submit</button>
                </section>
            </form>
            <div id="scripture"><img src="images/old_testament.webp"><img src="images/new_testament.webp"><img src="images/book_of_mormon.webp"><img src="images/doctrine_and_covenants.webp"><img src="./images/pearl_of_great_price.webp"></div>
        </div>

        <div id="output"></div>

        <script>
            // Here is some Javascript to start looking forward to wdd131
            document.getElementById("closeBtn").addEventListener("click", function () {
                document.getElementById("formContainer").style.display = "none";
             });
            const form = document.getElementById('myForm');
            const output = document.getElementById('output');

            form.addEventListener('submit', function (event) {
                event.preventDefault(); // Stop form from actually submitting

                const formData = new FormData(form);
                const entries = [];

                for (const [key, value] of formData.entries()) {
                    if (key == "password") {
                        entries.push(`<strong>${key}</strong>: ${value} (you should probably encrypt the password)`);
                    } else {
                        entries.push(`<strong>${key}</strong>: ${value}`);
                    }
            }

            output.innerHTML = `
            <br>  
            <h3>Here is the data that would be sent to the server:</h3>
            <ul>
                ${entries.map(item => `<li>${item}</li>`).join('')}
            </ul>
            `;
                });
        </script>

    </body>

</html>
